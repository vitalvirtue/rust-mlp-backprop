[package]
name = "mlp"
version = "0.1.0"
edition = "2024"
default-run = "mlp"
rust-version = "1.85"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
plotly = "0.14.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
